name: ps4_pkg_tool
description: A real PS4 PKG Tool application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  http: ^1.2.0
  wakelock_plus: ^1.2.0
  path_provider: ^2.1.0
  google_mobile_ads: ^9.1.0
  url_launcher: ^6.2.0
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.0
  share_plus: ^10.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/payload.bin

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
