plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.ps4_pkg_tool"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    flavorDimensions "app_type"

    productFlavors {
        official {
            dimension "app_type"
            applicationId "com.example.ps4_pkg_tool"
            resValue "string", "app_name", "PS4 PKG Tool"
        }
        dev {
            dimension "app_type"
            applicationId "com.example.ps4_pkg_tool.dev"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "PS4 PKG Admin"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}
