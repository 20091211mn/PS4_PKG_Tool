plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keyProps = new Properties()
def keyFile = rootProject.file('key.properties')
if (keyFile.exists()) {
    keyFile.withInputStream { keyProps.load(it) }
}

android {
    namespace "com.ps4pkg.studio"
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    flavorDimensions "default"

    productFlavors {
        dev {
            dimension "default"
            applicationId "com.ps4pkg.admin"
            versionNameSuffix "-dev"
        }
        official {
            dimension "default"
            applicationId "com.ps4pkg.studio"
            versionNameSuffix "-official"
        }
    }

    defaultConfig {
        applicationId "com.ps4pkg.studio"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            if (keyFile.exists()) {
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}