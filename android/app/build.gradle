plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.ps4pkg.studio"
    compileSdk 34

    flavorDimensions "default"

    productFlavors {
        dev {
            dimension "default"
            applicationId "com.ps4pkg.dev"
            versionNameSuffix "-dev"
        }
        official {
            dimension "default"
            applicationId "com.ps4pkg.studio"
            versionNameSuffix "-official"
        }
    }

    defaultConfig {
        applicationId "com.ps4pkg.studio"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}