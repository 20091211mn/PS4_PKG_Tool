name: Build PS4 App and Windows tool

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ps4_v*.zip'
      - 'app/main_ui3.cpp'
      - 'ci/ps4_app_build.sh'
      - 'ci/make_ui_main.py'
      - 'pc/**'
      - '.github/workflows/build-ps4.yml'

permissions:
  contents: write

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the newest update zip (if one was uploaded)
        run: |
          Z=$(ls ps4_v*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$Z" ]; then
            echo "Using update: $Z"
            unzip -o -q "$Z" -x '.github/*' -d .
          else
            echo "No update zip - using the sources already in the repository"
          fi
          ls -la app ci

      - name: Get OpenOrbis samples (matching tag)
        run: |
          git clone --depth 1 --branch v0.5.1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain oo || git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain oo
          echo "SAMPLES REF: $(git -C oo describe --tags --always)"

      - name: Prepare app from font sample
        run: |
          M=oo/samples/font/font/main.cpp
          [ -f "$M" ] || { echo "no main.cpp at $M"; find oo/samples/font -maxdepth 2 | head -30; exit 1; }
          F=$(grep -o '"/app0/[^"]*\.ttf"' "$M" | head -1 || true)
          echo "FONT PATH: $F"
          { if [ -n "$F" ]; then echo "#define PS4UI_FONT $F"; fi; cat app/main_ui3.cpp; } > /tmp/ui_full.cpp
          python3 ci/make_ui_main.py "$M" /tmp/ui_full.cpp

      - name: Provide font
        run: |
          T=oo/samples/font/pkg/Gontserrat-Regular.ttf
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$T"
          ls -l "$T"

      - name: Build (Docker)
        run: |
          ok=0; : > /tmp/recap.txt
          for IMG in openorbisofficial/toolchain:latest openorbisofficial/toolchain:v0.5.1; do
            echo "=========== TRY $IMG"
            rc=0
            docker run --rm --user root -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 -w /workspace -v "$PWD":/workspace $IMG sh ci/ps4_app_build.sh > /tmp/b.log 2>&1 || rc=$?
            tail -n 15 /tmp/b.log
            grep '^@@' /tmp/b.log || true
            echo "### $IMG (exit $rc)" >> /tmp/recap.txt
            grep '^@@' /tmp/b.log >> /tmp/recap.txt || true
            if [ "$rc" -eq 0 ]; then ok=1; echo "BUILD OK WITH $IMG"; break; fi
          done
          if [ "$ok" != 1 ]; then
            echo "################ FINAL RECAP"
            cat /tmp/recap.txt
            exit 1
          fi

      - name: Collect PKG
        run: |
          mkdir -p out
          P=$(find oo/samples/font -name '*.pkg' | head -1)
          [ -n "$P" ] || { echo "no pkg produced"; exit 1; }
          cp "$P" out/PS4-PKG-Tool.pkg
          cp "$P" "out/PS4-PKG-Tool-b${{ github.run_number }}.pkg"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: PS4-App-PKG
          path: out/*.pkg

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ps4-latest
          name: PS4 PKG Tool (latest build)
          body: "Build #${{ github.run_number }}. Download PS4-PKG-Tool.pkg below."
          files: |
            out/PS4-PKG-Tool.pkg
            out/PS4-PKG-Tool-b${{ github.run_number }}.pkg

  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    needs: build-ps4
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply the newest update zip (if one was uploaded)
        shell: bash
        run: |
          Z=$(ls ps4_v*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$Z" ]; then
            echo "Using update: $Z"
            python -m zipfile -e "$Z" .
          else
            echo "No update zip - using the sources already in the repository"
          fi
          ls pc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        shell: bash
        run: cd pc && python -m unittest -v test_core

      - name: GUI smoke test (does not block the build)
        shell: bash
        continue-on-error: true
        run: cd pc && python pkgtool_gui.py --selftest

      - name: Build exe
        shell: bash
        run: |
          pip install pyinstaller
          cd pc
          pyinstaller --onefile --windowed --name PS4-PKG-Tool-PC pkgtool_gui.py
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: PS4-PKG-Tool-PC
          path: pc/dist/PS4-PKG-Tool-PC.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ps4-latest
          name: PS4 PKG Tool (latest build)
          files: pc/dist/PS4-PKG-Tool-PC.exe
