name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Portable Windows Executable
        run: |
          npm init -y
          npm install electron electron-builder --save-dev
          npx electron-builder --win portable

      - name: Find and Rename EXE
        run: |
          $EXE_PATH = Get-ChildItem -Path dist\*.exe | Select-Object -ExpandProperty FullName -First 1
          Copy-Item $EXE_PATH -Destination .\PS4_PKG_Studio_Windows.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PS4_PKG_Studio_Windows_EXE
          path: PS4_PKG_Studio_Windows.exe
