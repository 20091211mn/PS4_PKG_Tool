name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Project
        run: flutter create . --platforms=windows --org=com.ps4pkg.studio

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Prepare Executable File
        shell: pwsh
        run: |
          $EXE_PATH = Get-ChildItem -Path "build\windows\x64\runner\Release\*.exe" | Select-Object -First 1
          Copy-Item -Path $EXE_PATH.FullName -Destination "PS4_PKG_Studio_Windows_${{ github.ref_name }}.exe"

      - name: Upload Windows EXE to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "PS4_PKG_Studio_Windows_${{ github.ref_name }}.exe" --clobber || gh release create "${{ github.ref_name }}" "PS4_PKG_Studio_Windows_${{ github.ref_name }}.exe" --title "PS4 PKG Studio ${{ github.ref_name }}" --notes "💻 **نسخة Windows EXE جاهزة للتحميل!**"
