name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Windows Executable
        run: |
          npm install -g nativefier
          nativefier --name "PS4_PKG_Studio" "www/index.html" --platform windows --arch x64 --portable

      - name: Create Zip Package
        run: |
          Compress-Archive -Path PS4_PKG_Studio-win32-x64\* -DestinationPath PS4_PKG_Studio_Windows.zip

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: PS4_PKG_Studio_Windows
          path: PS4_PKG_Studio_Windows.zip
