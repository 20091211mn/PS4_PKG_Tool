name: Build PS4 Homebrew App

on:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenOrbis SDK Release
        run: |
          wget https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.2/OpenOrbis-PS4-Toolchain-v0.5.2.tar.gz
          mkdir -p oo
          tar -xzf OpenOrbis-PS4-Toolchain-v0.5.2.tar.gz -C oo
          chmod +x oo/bin/linux/* oo/bin/linux/PkgTool.Core

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make imagemagick libstdc++-12-dev

      - name: Use our logo as app icon
        run: |
          IM=$(command -v magick || command -v convert)
          find oo/samples/hello_world -name icon0.png
          for f in $(find oo/samples/hello_world -name icon0.png); do
            $IM assets/icon.png -resize 512x512! PNG24:$f
          done

      - name: Build Code and Create PKG
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/oo
          PATH: ${{ github.workspace }}/oo/bin/linux:${{ env.PATH }}
        run: |
          cd oo/samples/hello_world
          make
          PkgTool.Core pkg_build pkg/pkg.gp4 .

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-App-PKG
          path: oo/samples/hello_world/*.pkg
          if-no-files-found: error
