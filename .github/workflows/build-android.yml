name: Build & Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Native Android Project
        run: flutter create . --platforms=android --org=com.ps4pkg.studio

      - name: Inject Permissions into AndroidManifest
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST_FILE"
            sed -i 's/<application/<application android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true"/g' "$MANIFEST_FILE"
          fi

      - name: Inject Repositories & Force compileSdk 36
        run: |
          cat << 'GRADLE_EOF' >> android/build.gradle

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          GRADLE_EOF

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create or Update GitHub Release with Android APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NAME="PS4_PKG_Studio_Android_${{ github.ref_name }}.apk"
          
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release-unsigned.apk" "$RELEASE_NAME"
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "$RELEASE_NAME"
          fi
          
          gh release create "${{ github.ref_name }}" "$RELEASE_NAME" \
            --title "PS4 PKG Studio ${{ github.ref_name }}" \
            --notes "🚀 **إصدار رسمي متكامل ${{ github.ref_name }}:**
            
            📱 **نسخة الأندرويد (APK):**
            - مدير ملفات خفيف ومدمج.
            - معالجة بالبث المباشر (Stream Buffering) لتوفير الذاكرة للأجهزة الضعيفة.
            
            💻 **نسخة الويندوز (EXE):**
            - ملف تنفيذي مباشر للكمبيوتر." || gh release upload "${{ github.ref_name }}" "$RELEASE_NAME" --clobber
