name: Build & Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Native Android Project
        run: flutter create . --platforms=android --org=com.ps4pkg.studio

      - name: Inject Permissions into AndroidManifest
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST_FILE"
            sed -i 's/<application/<application android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true"/g' "$MANIFEST_FILE"
          fi

      - name: Force compileSdk 36 on all dependencies
        run: |
          cat << 'GRADLE_EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          GRADLE_EOF

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Release File
        run: |
          mkdir -p release_files
          cp build/app/outputs/flutter-apk/app-release.apk release_files/PS4_PKG_Studio_${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "PS4 PKG Studio ${{ github.ref_name }}"
          body: |
            ### 🚀 الإصدار النيتيف الجديد (Flutter Native)
            
            - بناء نيتيف كامل بـ Flutter لسرعة فائقة واستقرار أعلى.
            - دعم تقطيع ودمج أجزاء الـ PKG مع الـ Multi-threading.
            - دعم قراءة الميتاداتا والتثبيت الشبكي المباشر لـ PS4 GoldHEN.
          files: release_files/PS4_PKG_Studio_${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
