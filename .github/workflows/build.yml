name: Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenOrbis Toolchain Manually
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils make clang
          sudo mkdir -p /usr/local/openorbis

      - name: Build Project
        run: |
          # تنفيذ أمر البناء مباشرة في المجلد الرئيسي للمشروع
          make
