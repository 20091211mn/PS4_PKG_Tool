name: Build Android & iOS Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Recreate Android Framework
      run: |
        flutter create . --platforms=android --org=com.ps4pkg.studio

    - name: Configure Android Permissions & Gradle Properties
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        GRADLE_PROPS="android/gradle.properties"

        # إضافة إلغاء فحص تعارض AAR وتثبيت إصدار compileSdk
        echo "android.suppressUnsupportedCompileSdk=36" >> $GRADLE_PROPS
        echo "android.useAndroidX=true" >> $GRADLE_PROPS
        echo "android.enableJetifier=true" >> $GRADLE_PROPS

        # حقن الأذونات
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>' $MANIFEST_PATH
        sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' $MANIFEST_PATH

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK with CompileSDK 36
      run: |
        flutter build apk --release --extra-build-args="-Pandroid.compileSdkVersion=36"

    - uses: actions/upload-artifact@v4
      with:
        name: PS4-PKG-Studio-Android-APK
        path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Recreate iOS Framework
      run: |
        flutter create . --platforms=ios --org=com.ps4pkg.studio

    - name: Get Dependencies
      run: flutter pub get

    - name: Build iOS App
      run: flutter build ios --release --no-codesign

    - name: Package IPA
      run: |
        cd build/ios/iphoneos
        mkdir Payload
        mv Runner.app Payload/
        zip -r PS4-PKG-Studio-iOS.ipa Payload

    - uses: actions/upload-artifact@v4
      with:
        name: PS4-PKG-Studio-iOS-IPA
        path: build/ios/iphoneos/PS4-PKG-Studio-iOS.ipa
