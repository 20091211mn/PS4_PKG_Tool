name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            libssl-dev \
            openssl \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblldb-dev \
            libffi-dev \
            libreadline-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            xclip xsel ccache zip unzip

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade \
            "pip==24.3.1" \
            "setuptools<70" \
            wheel
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.33" \
            "python-for-android==2024.1.21"

      - name: Build APK with Buildozer
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/pip-constraints.txt
        run: |
          rm -rf .buildozer
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-PKG-Tool-APK
          path: bin/*.apk
