name: Build Android & iOS Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Native Android Project
      run: |
        flutter create . --platforms=android --org=com.ps4pkg.studio

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK Release
      run: |
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PS4-PKG-Studio-Android-APK
        path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Native iOS Project
      run: |
        flutter create . --platforms=ios --org=com.ps4pkg.studio

    - name: Get Dependencies
      run: flutter pub get

    - name: Build iOS App
      run: flutter build ios --release --no-codesign

    - name: Package IPA
      run: |
        cd build/ios/iphoneos
        mkdir Payload
        mv Runner.app Payload/
        zip -r PS4-PKG-Studio-iOS.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: PS4-PKG-Studio-iOS-IPA
        path: build/ios/iphoneos/PS4-PKG-Studio-iOS.ipa
