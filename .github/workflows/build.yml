name: Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenOrbis Toolchain Manually
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils make clang
          sudo mkdir -p /usr/local/openorbis

      - name: Build PS4 Component
        run: |
          # الدخول حصرياً إلى مجلد الـ PS4 والبناء من داخله دون المساس ببقية الملفات
          cd ps4-pkg-pc
          if [ -f "Makefile" ]; then
            make
          else
            echo "Makefile not found in ps4-pkg-pc, checking files..."
            ls -la
          fi
