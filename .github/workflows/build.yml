name: Build PS4 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenOrbis Toolchain Manually
        run: |
          # تثبيت الحزم المطلوبة وتحميل الأدوات يدوياً
          sudo apt-get update
          sudo apt-get install -y wget xz-utils make clang
          
          # إنشاء مجلد الأدوات وتنزيل OpenOrbis SDK/Toolchain
          sudo mkdir -p /usr/local/openorbis
          # يمكنك تعديل رابط التحميل إذا كان لديك رابط مباشر لـ Toolchain الخاصة بـ OpenOrbis
          
      - name: Build Project
        run: |
          cd oo/samples/hello_world
          make
