name: Build Android APK v1.0.5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Clean and Setup Android Platform
        run: |
          rm -rf platforms plugins
          cordova platform add android@12.0.0

      - name: Build Debug APK
        run: cordova build android --debug -- --no-daemon

      - name: Find and Rename APK
        run: |
          APK_PATH=$(find platforms/android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" ./PS4_PKG_Studio_v1.0.5.apk

      - name: Upload Direct APK File
        uses: actions/upload-artifact@v4
        with:
          name: PS4_PKG_Studio_v1.0.5_Android
          path: PS4_PKG_Studio_v1.0.5.apk
