name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install Android Build Tools 33.0.2
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Add Android Platform
        run: |
          rm -rf platforms plugins
          cordova platform add android@12.0.0

      - name: Patch Gradle XmlParser & Generate Wrapper
        run: |
          find platforms/android -name "*.gradle" -exec sed -i 's/new XmlParser(/new groovy.xml.XmlParser(/g' {} +
          find platforms/android -name "*.gradle" -exec sed -i 's/import groovy.util.XmlParser/import groovy.xml.XmlParser/g' {} +
          cd platforms/android
          gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: cordova build android --debug -- --no-daemon

      - name: Find and Rename APK
        run: |
          APK_PATH=$(find platforms/android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" ./PS4_PKG_Studio_v1.0.5.apk

      - name: Upload Direct APK File
        uses: actions/upload-artifact@v4
        with:
          name: PS4_PKG_Studio_v1.0.5_Android
          path: PS4_PKG_Studio_v1.0.5.apk
