name: Build Multi-Platform Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Bump Version Number
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version || '1.0.5'")
          NEXT_VER=$(node -p "let v='$CURRENT_VER'.split('.'); v[2]=parseInt(v[2]||0)+1; v.join('.')")
          echo "Building Version: $NEXT_VER"
          sed -i "s/version=\"[^\"]*\"/version=\"$NEXT_VER\"/g" config.xml
          echo "NEW_VERSION=$NEXT_VER" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Install Android Build Tools 33.0.2
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Add Android Platform & Plugins
        run: |
          rm -rf platforms plugins
          cordova platform add android@12.0.0
          cordova plugin add cordova-plugin-file

      - name: Patch Gradle XmlParser & Generate Wrapper
        run: |
          find platforms/android -name "*.gradle" -exec sed -i 's/new XmlParser(/new groovy.xml.XmlParser(/g' {} +
          find platforms/android -name "*.gradle" -exec sed -i 's/import groovy.util.XmlParser/import groovy.xml.XmlParser/g' {} +
          cd platforms/android
          gradle wrapper --gradle-version 8.5

      - name: Build Android Debug APK
        run: cordova build android --debug -- --no-daemon

      - name: Prepare Multi-Platform Output Directory
        run: |
          mkdir -p release_files
          APK_PATH=$(find platforms/android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" ./release_files/PS4_PKG_Studio_v${{ env.NEW_VERSION }}_Android.apk
          
          # إعداد النسخة المخصصة للكمبيوتر (Windows Portable)
          mkdir -p ./release_files/Windows_Version
          cp -r www/* ./release_files/Windows_Version/
          
          # إعداد حزمة الآيفون (iOS/IPA Web Payload)
          mkdir -p ./release_files/iOS_Version
          cp -r www/* ./release_files/iOS_Version/

      - name: Compress All Platforms into Single ZIP
        run: |
          cd release_files
          zip -r "../PS4_PKG_Studio_v${{ env.NEW_VERSION }}_All_Platforms.zip" .
          cd ..

      - name: Upload Single ZIP Release
        uses: actions/upload-artifact@v4
        with:
          name: PS4_PKG_Studio_v${{ env.NEW_VERSION }}_Package
          path: PS4_PKG_Studio_v${{ env.NEW_VERSION }}_All_Platforms.zip
