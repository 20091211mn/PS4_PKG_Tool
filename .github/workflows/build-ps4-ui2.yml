name: Build PS4 Splitter UI v2

on:
  workflow_dispatch:

jobs:
  build-ps4-ui2:
    name: Build PS4 UI v2 PKG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get OpenOrbis samples (matching tag)
        run: |
          git clone --depth 1 --branch v0.5.1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain oo || git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain oo
          echo "SAMPLES REF: $(git -C oo describe --tags --always)"

      - name: Prepare UI v2 from font sample
        run: |
          M=oo/samples/font/font/main.cpp
          [ -f "$M" ] || { echo "no main.cpp at $M"; find oo/samples/font -maxdepth 2 | head -30; exit 1; }
          echo "---- original main (diagnostics)"
          grep -n 'Sysmodule\|FT_Init\|ttf\|InitFont\|Scene2D(\|GRAPHICS_USES_FONT' "$M" | head -25 || true
          grep -n 'Sysmodule\|FT_Init' oo/samples/_common/graphics.cpp | head -10 || true
          F=$(grep -o '"/app0/[^"]*\.ttf"' "$M" | head -1 || true)
          echo "FONT PATH: $F"
          { if [ -n "$F" ]; then echo "#define PS4UI_FONT $F"; fi; cat app/main_ui2.cpp; } > /tmp/ui_full.cpp
          python3 ci/make_ui_main.py "$M" /tmp/ui_full.cpp

      - name: Provide font
        run: |
          T=oo/samples/font/pkg/Gontserrat-Regular.ttf
          if [ ! -f "$T" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-dejavu-core
            cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$T"
          fi
          ls -l "$T"

      - name: Build (Docker)
        run: |
          ok=0; : > /tmp/recap.txt
          for IMG in openorbisofficial/toolchain:latest openorbisofficial/toolchain:v0.5.1; do
            echo "=========== TRY $IMG"
            rc=0
            docker run --rm --user root -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 -w /workspace -v "$PWD":/workspace $IMG sh ci/ps4_ui2_build.sh > /tmp/b.log 2>&1 || rc=$?
            tail -n 15 /tmp/b.log
            grep '^@@' /tmp/b.log || true
            echo "### $IMG (exit $rc)" >> /tmp/recap.txt
            grep '^@@' /tmp/b.log >> /tmp/recap.txt || true
            if [ "$rc" -eq 0 ]; then ok=1; echo "BUILD OK WITH $IMG"; break; fi
          done
          if [ "$ok" != 1 ]; then
            echo "################ FINAL RECAP"
            cat /tmp/recap.txt
            exit 1
          fi

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-UI2-PKG
          path: oo/samples/font/**/*.pkg
          if-no-files-found: error
