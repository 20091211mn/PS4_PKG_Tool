name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Add iOS Platform & Plugins
        run: |
          cordova platform add ios
          cordova plugin add cordova-plugin-file

      - name: Build iOS Package
        run: |
          cd platforms/ios
          xcodebuild -workspace "PS4 PKG Studio.xcworkspace" -scheme "PS4 PKG Studio" -configuration Debug -destination "generic/platform=iOS" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Create IPA File
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r PS4_PKG_Studio.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: PS4_PKG_Studio_iOS_IPA
          path: PS4_PKG_Studio.ipa
