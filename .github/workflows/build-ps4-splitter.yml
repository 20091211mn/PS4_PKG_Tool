name: Build PS4 Splitter App

on:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential git imagemagick clang lld wget unzip

      - name: Setup OpenOrbis Toolchain
        run: |
          # تنزيل واستخراج بيئة OpenOrbis المكتملة
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo
          
          # إعداد الترويسات والـ Sysroot الأساسية داخل البيئة
          cd oo
          git clone https://github.com/OpenOrbis/headers.pck.git include_pck || true
          if [ -d "include_pck" ]; then
            cp -rn include_pck/* include/ 2>/dev/null || true
          fi

      - name: Build PS4 PKG
        run: |
          export OO_PS4_TOOLCHAIN="$(pwd)/oo"
          export PATH="$OO_PS4_TOOLCHAIN/bin:$PATH"

          D="oo/samples/hello_world"
          
          # استبدال الكود بملف التطبيق الخاص بك main_v2.cpp
          M=$(find $D -maxdepth 2 \( -name main.cpp -o -name main.c \) | head -1)
          cp app/main_v2.cpp "$M"

          # ضبط الأيقونة
          IM=$(command -v magick || command -v convert)
          for f in $(find $D -name icon0.png); do
            if [ -f "assets/icon.png" ] && [ -n "$IM" ]; then
              $IM assets/icon.png -resize 512x512! PNG24:$f || true
            fi
          done

          # البناء المستقر
          cd "$D"
          make clean || true
          make OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-PKG
          path: oo/samples/hello_world/*.pkg
          if-no-files-found: error
