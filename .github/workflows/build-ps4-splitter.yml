name: Build PS4 Splitter App

on:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get OpenOrbis samples
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/OpenOrbis-PS4-Toolchain
          path: oo

      - name: Use our logo and code
        run: |
          D=oo/samples/hello_world
          ls -R $D | head -40
          M=$(find $D -maxdepth 2 \( -name main.cpp -o -name main.c \) | head -1)
          echo "REPLACING: $M"
          [ -n "$M" ] || { echo "no main source found"; exit 1; }
          cp app/main_v2.cpp "$M"
          IM=$(command -v magick || command -v convert)
          for f in $(find $D -name icon0.png); do $IM assets/icon.png -resize 512x512! PNG24:$f; done

      - name: Build with OpenOrbis (Docker)
        run: |
          docker run --rm --user root -w /workspace -v "$PWD":/workspace openorbisofficial/toolchain:latest bash -c "sh ci/ps4_build.sh"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-PKG
          path: oo/samples/hello_world/*.pkg
          if-no-files-found: error
