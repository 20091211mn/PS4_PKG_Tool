name: Build PS4 Splitter App

on:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick make build-essential wget curl git unzip clang lld

      - name: Setup OpenOrbis Environment Manually
        run: |
          # سحب المستودع الرسمي مباشرة
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo
          
          # إعداد وتجهيز الترويسات والـ SDK
          cd oo
          mkdir -p include/c++/v1
          
          # جلب الترويسات من مستودع الـ Header المعتمد
          git clone https://github.com/OpenOrbis/headers.pck.git include_pck || true
          if [ -d "include_pck" ]; then
            cp -r include_pck/* include/ || true
          fi

      - name: Build PS4 PKG
        run: |
          export OO_PS4_TOOLCHAIN="$(pwd)/oo"
          export PATH="$OO_PS4_TOOLCHAIN/bin:$PATH"

          D="oo/samples/hello_world"
          M=$(find $D -maxdepth 2 \( -name main.cpp -o -name main.c \) | head -1)
          echo "Replacing code at: $M"
          cp app/main_v2.cpp "$M"

          # تغيير الأيقونة
          IM=$(command -v magick || command -v convert)
          for f in $(find $D -name icon0.png); do
            if [ -f "assets/icon.png" ]; then
              $IM assets/icon.png -resize 512x512! PNG24:$f || true
            fi
          done

          cd $D
          # البناء مع تعطيل خيار البحث في الترويسات التي تسبب أخطاء
          make OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN" || make

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-PKG
          path: oo/samples/hello_world/*.pkg
          if-no-files-found: error
