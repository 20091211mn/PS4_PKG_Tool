name: Build PS4 Splitter App

on:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get OpenOrbis samples (matching tag)
        run: |
          git clone --depth 1 --branch v0.5.1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain oo || git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain oo
          echo "SAMPLES REF: $(git -C oo describe --tags --always)"
          grep -n 'CDIR)/' oo/samples/hello_world/Makefile | head

      - name: Use our logo and code
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          D=oo/samples/hello_world
          M=$(find $D -maxdepth 3 \( -name main.cpp -o -name main.c \) | head -1)
          echo "REPLACING: $M"
          [ -n "$M" ] || { echo "no main source found"; exit 1; }
          cp app/main_v2.cpp "$M"
          IM=$(command -v magick || command -v convert || true)
          echo "IM: $IM"
          if [ -n "$IM" ]; then
            for f in $(find $D -name icon0.png); do $IM assets/icon.png -resize 512x512! PNG24:$f; done
          else
            echo "NO IMAGEMAGICK - keeping default icon"
          fi

      - name: Prepare UI variant
        run: |
          cp -r oo/samples/hello_world oo/samples/hello_ui
          S=oo/samples/hello_ui/hello_world
          cp app/main_ui.cpp $S/main.cpp
          cp oo/samples/_common/graphics.cpp oo/samples/_common/graphics.h oo/samples/_common/log.h $S/
          sed -i '/^LIBS/ s/-lc++/-lc++ -lSceVideoOut -lSceSysmodule/' oo/samples/hello_ui/Makefile
          sed -i 's/Hello World/PS4 PKG Manager/g' oo/samples/hello_ui/Makefile
          grep -n '^LIBS' oo/samples/hello_ui/Makefile
          ls $S

      - name: Build with OpenOrbis (Docker)
        run: |
          i=0; ok=0; : > /tmp/recap.txt
          for IMG in openorbisofficial/toolchain:latest openorbisofficial/toolchain:v0.5.1; do
            i=$((i+1))
            echo "=========== TRY $IMG"
            rc=0
            docker run --rm --user root -w /workspace -v "$PWD":/workspace $IMG sh ci/ps4_build.sh > /tmp/a_$i.log 2>&1 || rc=$?
            tail -n 15 /tmp/a_$i.log; grep '^@@' /tmp/a_$i.log || true
            echo "### $IMG (exit $rc)" >> /tmp/recap.txt
            grep '^@@' /tmp/a_$i.log >> /tmp/recap.txt || true
            if [ "$rc" -eq 0 ]; then ok=1; echo "BUILD OK WITH $IMG"; break; fi
          done
          if [ "$ok" != 1 ]; then
            echo "################ FINAL RECAP"
            cat /tmp/recap.txt
            exit 1
          fi

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-PKG
          path: oo/samples/hello_world/**/*.pkg
          if-no-files-found: error

      - name: Upload UI PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-UI-PKG
          path: oo/samples/hello_ui/**/*.pkg
          if-no-files-found: warn
