name: Build PS4 Splitter App

on:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make build-essential git imagemagick clang lld wget unzip

      - name: Setup OpenOrbis Toolchain & Direct Structure
        run: |
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo
          
          # إنشاء هيكلية نظيفة يدوياً للمشروع لضمان عدم وجود ملفات مفقودة
          mkdir -p build_output/sce_sys
          
          # جلب ترويسات OpenOrbis الأساسية يدوياً وضبطها
          if [ -d "oo/include" ]; then
            echo "OpenOrbis include directory exists."
          else
            mkdir -p oo/include
          fi

      - name: Compile App Manually (Without Makefile)
        run: |
          export OO_PS4_TOOLCHAIN="$(pwd)/oo"
          export PATH="$OO_PS4_TOOLCHAIN/bin:$PATH"

          # تجهيز مجلد العمل اليدوي
          cd build_output

          echo "Compiling main_v2.cpp directly..."
          # الترجمة المباشرة مع عزل ترويسات لينكس واستخدام ترويسات OpenOrbis فقط
          clang++ --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -c \
            -isystem ../oo/include \
            -isystem ../oo/include/c++/v1 \
            ../../app/main_v2.cpp -o main.o

          echo "Linking to eboot.bin..."
          clang++ --target=x86_64-pc-freebsd12-elf -fuse-ld=lld \
            -Wl,--entry=_start -nostdlib \
            main.o -o eboot.bin || {
              # طريقة ربط بديلة في حال احتجت مكتبات النظام الأساسية
              clang++ --target=x86_64-pc-freebsd12-elf main.o -o eboot.bin
            }

          # وضع أيقونة افتراضية أو تخصيصها إذا وجدت
          if [ -f "../../assets/icon.png" ]; then
            convert ../../assets/icon.png -resize 512x512! PNG24:icon0.png || true
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-PKG
          path: build_output/eboot.bin
          if-no-files-found: error
