name: Build PS4 Splitter App

on:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick make build-essential wget curl git

      - name: Get OpenOrbis Toolchain
        run: |
          git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo

      - name: Build with Direct Clang Commands
        run: |
          sh ci/ps4_build.sh

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-PKG
          path: oo/samples/hello_world/*.pkg
          if-no-files-found: error
