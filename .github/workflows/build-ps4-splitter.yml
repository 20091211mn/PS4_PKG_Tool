name: Build PS4 Splitter App

on:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenOrbis Toolchain
        uses: OpenOrbis/toolchain-action@v0.5.1
        continue-on-error: true

      - name: Fallback Setup OpenOrbis Toolchain if needed
        run: |
          if [ ! -d "oo" ] && [ -z "$OO_PS4_TOOLCHAIN" ]; then
            git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo
            echo "OO_PS4_TOOLCHAIN=$(pwd)/oo" >> $GITHUB_ENV
            echo "$(pwd)/oo/bin" >> $GITHUB_PATH
          fi

      - name: Install extra dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick make build-essential

      - name: Prepare Code & Build PKG
        run: |
          # تحديد مسار OpenOrbis
          if [ -z "$OO_PS4_TOOLCHAIN" ]; then
            export OO_PS4_TOOLCHAIN="$(pwd)/oo"
          fi
          export PATH="$OO_PS4_TOOLCHAIN/bin:$PATH"

          # تأمين مجلد العينات
          if [ ! -d "oo/samples/hello_world" ]; then
            git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo_temp
            mkdir -p oo/samples
            cp -r oo_temp/samples/* oo/samples/ || true
          fi

          D="oo/samples/hello_world"
          M=$(find $D -maxdepth 2 \( -name main.cpp -o -name main.c \) | head -1)
          echo "Replacing code at: $M"
          cp app/main_v2.cpp "$M"

          # تغيير الأيقونة
          IM=$(command -v magick || command -v convert)
          for f in $(find $D -name icon0.png); do
            if [ -f "assets/icon.png" ]; then
              $IM assets/icon.png -resize 512x512! PNG24:$f || true
            fi
          done

          # البناء
          cd $D
          make OO_PS4_TOOLCHAIN="$OO_PS4_TOOLCHAIN"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-PKG
          path: oo/samples/hello_world/*.pkg
          if-no-files-found: error
