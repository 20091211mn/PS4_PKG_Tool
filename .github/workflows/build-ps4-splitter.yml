name: Build PS4 Splitter App

on:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build PS4 PKG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick make build-essential wget curl git

      - name: Get OpenOrbis Toolchain & Install Sysroot
        run: |
          git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo
          cd oo
          # تشغيل سكربت التثبيت الجلْب ملفات الـ Sysroot والترويسات المطلوبة
          if [ -f "install.sh" ]; then
            chmod +x install.sh
            ./install.sh || true
          fi

      - name: Use our logo and code
        run: |
          D=oo/samples/hello_world
          ls -R $D | head -40
          M=$(find $D -maxdepth 2 \( -name main.cpp -o -name main.c \) | head -1)
          echo "REPLACING: $M"
          [ -n "$M" ] || { echo "no main source found"; exit 1; }
          cp app/main_v2.cpp "$M"
          IM=$(command -v magick || command -v convert)
          for f in $(find $D -name icon0.png); do $IM assets/icon.png -resize 512x512! PNG24:$f; done

      - name: Build with OpenOrbis Toolchain
        run: |
          sh ci/ps4_build.sh

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Splitter-PKG
          path: oo/samples/hello_world/*.pkg
          if-no-files-found: error
