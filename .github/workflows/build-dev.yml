name: Build Developer Admin APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build-dev:
    name: Build Developer Admin APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Regenerate missing Android files
        run: flutter create . --platforms=android

      - name: Fix compileSdk
        run: |
          F=android/app/build.gradle
          sed -i -E 's/compileSdk(Version)? *=? *[a-zA-Z.]*[0-9]*/compileSdk = 36/' $F
          sed -i -E 's/compileSdkVersion +[a-zA-Z.0-9]+/compileSdk = 36/' $F
          grep -n "compileSdk" $F

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Dev Admin Release APK
        run: flutter build apk --release --flavor dev --target lib/main.dart --no-tree-shake-icons

      - name: Upload Dev Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Developer-Admin-APK
          path: build/app/outputs/flutter-apk/app-dev-release.apk