name: Build Developer Admin APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build-dev:
    name: Build Developer Admin APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerate missing Android files
        run: flutter create . --platforms=android

      - name: Upgrade Gradle plugins
        run: |
          sed -i -E 's/(id "com.android.application" version ")[0-9.]+(")/\18.9.1\2/' android/settings.gradle
          sed -i -E 's/(id "org.jetbrains.kotlin.android" version ")[0-9.]+(")/\12.1.0\2/' android/settings.gradle
          sed -i -E 's#gradle-[0-9.]+-(all|bin).zip#gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep -n "version" android/settings.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix applicationId
        run: |
          F=android/app/build.gradle
          sed -i '/applicationIdSuffix/d' $F
          sed -i 's/com.example.ps4_pkg_tool.dev/com.ps4pkg.admin/g' $F
          sed -i 's/com.example.ps4_pkg_tool/com.ps4pkg.studio/g' $F
          grep -n "applicationId\|namespace" $F

      - name: Fix MainActivity package
        run: |
          D=android/app/src/main
          NEW=$D/kotlin/com/ps4pkg/studio
          mkdir -p $NEW
          for f in $(find $D -name "MainActivity.*"); do
            cp "$f" $NEW/MainActivity.kt
            [ "$f" != "$NEW/MainActivity.kt" ] && rm "$f"
          done
          sed -i 's/^package .*/package com.ps4pkg.studio/' $NEW/MainActivity.kt
          find $D -name "MainActivity.*"
          cat $NEW/MainActivity.kt

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Dev Admin Release APK
        run: flutter build apk --release --flavor dev --target lib/main.dart --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Dev Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Developer-Admin-APK
          path: build/app/outputs/flutter-apk/app-dev-release.apk
