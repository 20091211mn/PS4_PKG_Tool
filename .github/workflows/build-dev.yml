name: Build Developer Admin APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build-dev:
    name: Build Developer Admin APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Setup signing
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
            ls -l android/app/release.keystore
          else
            echo "NO SIGNING SECRETS - using debug key"
          fi

      - name: Generate icons
        run: dart run flutter_launcher_icons

      - name: Build Dev Admin Release APK
        run: |
          set -o pipefail
          flutter build apk --release --flavor dev --target lib/main_admin.dart --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build.log || { echo '=== REAL ERROR ==='; grep -n -B3 -A15 'What went wrong\|Failed to apply\|error:' build.log | head -80; echo '=== DART ERRORS ==='; grep -n 'Error:\|lib/[a-z_]*\.dart:[0-9]' build.log | head -40; exit 1; }

      - name: Upload Dev Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Developer-Admin-APK
          path: build/app/outputs/flutter-apk/app-dev-release.apk