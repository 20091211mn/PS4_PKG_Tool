name: Build Native Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git python3-dev libncurses5-dev libncursesw5-dev zlib1g-dev zip unzip openjdk-17-jdk autoconf libtool pkg-config libssl-dev

    - name: Install Buildozer & Dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload Native APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PS4-PKG-Studio-Native-APK
        path: bin/*.apk
