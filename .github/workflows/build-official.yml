name: Build and Release Official APK

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Official APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Official Release APK
        run: |
          set -o pipefail
          flutter build apk --release --flavor official --target lib/main.dart --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build.log || { echo '=== REAL ERROR ==='; grep -n -B3 -A15 'What went wrong\|Failed to apply\|error:' build.log | head -80; exit 1; }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Official-User-APK
          path: build/app/outputs/flutter-apk/app-official-release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PS4 PKG Tool Official v1.0.${{ github.run_number }}
          body: "النسخة الرسمية العامة لتطبيق PS4 PKG Tool جاهزة للتحميل المباشر."
          files: build/app/outputs/flutter-apk/app-official-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}