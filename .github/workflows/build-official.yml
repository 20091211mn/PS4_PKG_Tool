name: Build and Release Official APK

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Official APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix compileSdk
        run: |
          F=android/app/build.gradle
          sed -i -E 's/compileSdk(Version)? *=? *[a-zA-Z.]*[0-9]*/compileSdk = 36/' $F
          sed -i -E 's/compileSdkVersion +[a-zA-Z.0-9]+/compileSdk = 36/' $F
          grep -n "compileSdk" $F

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Official Release APK
        run: flutter build apk --release --flavor official --target lib/main.dart --no-tree-shake-icons

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Official-User-APK
          path: build/app/outputs/flutter-apk/app-official-release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PS4 PKG Tool Official v1.0.${{ github.run_number }}
          body: "النسخة الرسمية العامة لتطبيق PS4 PKG Tool جاهزة للتحميل المباشر."
          files: build/app/outputs/flutter-apk/app-official-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}